name: probe
on:
  workflow_dispatch:
jobs:
  info:
    runs-on: macos-15
    steps:
      - run: |
          sw_vers; uname -m
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcrun --find iig
          ls /Applications | grep -i xcode
  a14:
    runs-on: macos-14-arm64
    steps:
      - run: uname -m
  i15:
    runs-on: macos-15-intel
    steps:
      - run: uname -m; ls -d /Applications/Xcode*.app
